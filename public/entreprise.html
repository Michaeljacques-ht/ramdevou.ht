<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entreprise — Randevou.ht</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root { --marque: #2563EB; --marque2: #F59E0B; }
.banniere-ent { height: 210px; background: linear-gradient(130deg, var(--marque), var(--marque2)); position: relative; }
.entete-ent { max-width: 980px; margin: -64px auto 0; padding: 0 20px; position: relative; }
.carte-entete { background: #fff; border-radius: 18px; box-shadow: 0 10px 34px rgba(16,24,40,.12); padding: 22px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.logo-ent { width: 84px; height: 84px; border-radius: 18px; background: var(--marque); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 800; flex-shrink: 0; }
.corps-page { max-width: 980px; margin: 26px auto 60px; padding: 0 20px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 22px; align-items: start; }
@media (max-width: 860px) { .corps-page { grid-template-columns: 1fr; } }
.ligne-service { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--bordure); }
.ligne-service:last-child { border-bottom: none; }
.etapes-resa { display: flex; gap: 6px; margin-bottom: 18px; }
.etapes-resa .pas { flex: 1; height: 5px; border-radius: 99px; background: var(--bordure); }
.etapes-resa .pas.fait { background: var(--marque); }
.creneaux { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin-top: 12px; }
.creneau { padding: 9px 4px; border: 1px solid var(--bordure); border-radius: 9px; background: #fff; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 600; text-align: center; }
.creneau:hover { border-color: var(--marque); }
.creneau.choisi { background: var(--marque); color: #fff; border-color: var(--marque); }
.recap { background: var(--gris-clair); border-radius: 12px; padding: 14px 16px; font-size: 14px; }
.recap div { display: flex; justify-content: space-between; padding: 3px 0; }
.horaires-liste div { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13.5px; }
.ico-partage { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; display: block; }
</style>
</head>
<body>

<nav class="nav">
  <div class="conteneur nav-int">
    <a class="logo" href="/"><img src="/logo-marque.png" alt="" style="height:34px;width:auto">Randevou.ht</a>
    <div class="nav-droite">
      <a class="btn btn-fantome" href="/">← Retour à l'accueil</a>
    </div>
  </div>
</nav>

<div class="banniere-ent"></div>
<div class="entete-ent">
  <div class="carte-entete" id="entete"></div>
</div>

<main class="corps-page">
  <div style="display:grid;gap:22px">
    <section class="carte"><div class="carte-corps">
      <h2 style="font-size:19px">Services</h2>
      <div id="listeServices" class="mt"></div>
    </div></section>

    <section class="carte" id="carteChambres" style="display:none"><div class="carte-corps">
      <h2 style="font-size:19px">🛏️ Chambres & Séjours</h2>
      <div id="listeChambres" class="mt"></div>
      <div class="mt" style="border-top:1px solid var(--bordure);padding-top:16px">
        <h3 style="font-size:15px;margin-bottom:10px">Réserver un séjour</h3>
        <div class="grille" style="grid-template-columns:1fr 1fr;gap:10px">
          <div><label>Arrivée</label><input type="date" id="sjArrivee"></div>
          <div><label>Départ</label><input type="date" id="sjDepart"></div>
        </div>
        <label>Type de chambre</label>
        <select id="sjChambre"></select>
        <label>Nombre de personnes</label>
        <input type="number" id="sjPersonnes" min="1" value="2">
        <div id="sjDispo" class="mt"></div>
        <div id="sjCoordonnees" style="display:none">
          <label>Votre nom complet *</label><input id="sjNom">
          <label>Téléphone (WhatsApp) *</label><input id="sjTel" placeholder="Ex : 50937120000">
          <label>Email (recommandé)</label><input id="sjEmail" type="email" placeholder="Pour recevoir votre confirmation">
          <button class="btn btn-primaire mt" style="width:100%;background:var(--marque)" onclick="reserverSejour()">Confirmer la demande de séjour</button>
        </div>
        <div id="sjPaiement" style="display:none;margin-top:16px">
          <div style="background:#D1FADF;border-radius:10px;padding:14px;margin-bottom:14px">
            🎉 <strong>Demande enregistrée !</strong> <span id="montantPaiement"></span>
            <p class="petit muet" style="margin-top:6px">Procédez au paiement pour confirmer votre séjour.</p>
          </div>
          <button class="btn btn-primaire" style="width:100%;background:var(--marque)" onclick="initierPaiement('sejour')">💳 Payer maintenant</button>
        </div>
      </div>
    </div></section>

    <section class="carte"><div class="carte-corps">
      <div class="flex entre">
        <h2 style="font-size:19px">Avis clients</h2>
        <button class="btn btn-contour btn-petit" onclick="document.getElementById('voileAvis').classList.add('ouvert')">Laisser un avis</button>
      </div>
      <div id="listeAvis" class="mt"></div>
    </div></section>
  </div>

  <aside style="display:grid;gap:22px">
    <section class="carte" id="carteResa"><div class="carte-corps">
      <h2 style="font-size:19px">Réserver un rendez-vous</h2>
      <div class="etapes-resa mt" id="barrePas"><div class="pas fait"></div><div class="pas"></div><div class="pas"></div><div class="pas"></div></div>
      <div id="zonePas"></div>
    </div></section>

    <section class="carte"><div class="carte-corps">
      <h2 style="font-size:16px">Informations</h2>
      <div id="infos" class="mt petit"></div>
      <h3 style="font-size:14px;margin-top:16px">Horaires</h3>
      <div class="horaires-liste mt" id="horaires" style="margin-top:8px"></div>
    </div></section>

    <section class="carte" id="carteLocalisation" style="display:none"><div class="carte-corps">
      <h2 style="font-size:16px">📍 Localisation</h2>
      <div id="mapDistance" style="height:260px;border-radius:12px;margin-top:12px;background:#EEF2F7"></div>
      <div id="infoDistance" class="petit muet" style="margin-top:10px"></div>
      <button class="btn btn-contour btn-petit" style="width:100%;margin-top:10px" id="btnMaPosition" onclick="afficherMaPosition()">📡 Voir la distance depuis ma position</button>
    </div></section>

    <section class="carte"><div class="carte-corps">
      <h2 style="font-size:16px">Équipe</h2>
      <div id="equipe" class="mt"></div>
    </div></section>
  </aside>
</main>

<!-- Modale avis -->
<div class="voile" id="voileAvis">
  <div class="modale">
    <h3>Laisser un avis</h3>
    <label>Votre nom</label><input id="avisNom" placeholder="Ex : Jean Michel">
    <label>Note</label>
    <select id="avisNote"><option value="5">★★★★★ — Excellent</option><option value="4">★★★★☆ — Très bien</option><option value="3">★★★☆☆ — Bien</option><option value="2">★★☆☆☆ — Moyen</option><option value="1">★☆☆☆☆ — Décevant</option></select>
    <label>Commentaire</label><textarea id="avisTexte" rows="3" placeholder="Partagez votre expérience…"></textarea>
    <div class="flex mt" style="justify-content:flex-end">
      <button class="btn btn-fantome" onclick="document.getElementById('voileAvis').classList.remove('ouvert')">Annuler</button>
      <button class="btn btn-primaire" onclick="envoyerAvis()">Publier l'avis</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
const slug = location.pathname.replace(/^\//, '').replace(/\.html$/, '') || new URLSearchParams(location.search).get('slug');
let ent = null;
let resa = { pas: 1, service: null, date: '', heure: '' };
const NOMS_JOURS = { lun: 'Lundi', mar: 'Mardi', mer: 'Mercredi', jeu: 'Jeudi', ven: 'Vendredi', sam: 'Samedi', dim: 'Dimanche' };

async function charger() {
  try { ent = await api('/api/entreprises/' + slug); }
  catch { document.body.innerHTML = '<div class="conteneur centre" style="padding:80px 20px"><h1>Entreprise introuvable</h1><p class="muet mt">Cette page n\'existe pas ou n\'est pas encore approuvée.</p><a class="btn btn-primaire mt" href="/" style="margin-top:20px">Retour à l\'accueil</a></div>'; return; }

  document.title = ent.nom + ' — Randevou.ht';
  document.documentElement.style.setProperty('--marque', ent.couleur);
  document.documentElement.style.setProperty('--marque2', ent.couleur2);

  // Photo de couverture personnalisée (avec voile aux couleurs de la marque)
  if (ent.photoFond) {
    document.querySelector('.banniere-ent').style.background =
      `linear-gradient(130deg, ${ent.couleur}B3, ${ent.couleur2}66), url('${ent.photoFond}') center/cover`;
  }

  document.getElementById('entete').innerHTML = `
    <div class="logo-ent">${ent.logoImage ? `<img src="${ent.logoImage}" alt="Logo ${ech(ent.nom)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">` : ech(ent.logoTexte)}</div>
    <div style="flex:1;min-width:220px">
      <div class="flex" style="gap:10px;flex-wrap:wrap">
        <h1 style="font-size:24px">${ech(ent.nom)}</h1>
        ${ent.plan === 'premium' ? '<span class="badge badge-bleu">Premium</span>' : ''}
      </div>
      <p class="muet petit">${ICONES_CAT[ent.categorie] || '✨'} ${ech(ent.categorie)} • ${ech(ent.adresse)}</p>
      <p class="petit" style="margin-top:6px"><span class="etoiles">${etoiles(ent.note)}</span> <strong>${ent.note || '—'}</strong> <span class="muet">(${ent.totalAvis} avis)</span></p>
    </div>
    <div style="display:grid;gap:8px">
      <a class="btn btn-primaire" href="#carteResa" style="background:var(--marque)">Réserver maintenant</a>
      ${ent.whatsapp ? `<a class="btn btn-succes" target="_blank" rel="noopener" href="https://wa.me/${ech(ent.whatsapp)}">💬 WhatsApp</a>` : ''}
      <div class="flex" style="gap:6px;justify-content:center" aria-label="Partager cette page">
        <button class="btn btn-fantome btn-petit" onclick="partager('whatsapp')" title="Partager sur WhatsApp"><img src="/logos/whatsapp.png" alt="WhatsApp" class="ico-partage"></button>
        <button class="btn btn-fantome btn-petit" onclick="partager('facebook')" title="Partager sur Facebook"><img src="/logos/facebook.png" alt="Facebook" class="ico-partage"></button>
        <button class="btn btn-fantome btn-petit" onclick="partager('x')" title="Partager sur X"><img src="/logos/x.png" alt="X" class="ico-partage"></button>
        <button class="btn btn-fantome btn-petit" onclick="partager('copier')" title="Copier le lien">🔗</button>
      </div>
    </div>`;

  window.partager = async (canal) => {
    const url = location.href;
    const texte = `Prenez rendez-vous chez ${ent.nom} sur Randevou.ht : `;
    if (canal === 'whatsapp') window.open('https://wa.me/?text=' + encodeURIComponent(texte + url), '_blank');
    else if (canal === 'facebook') window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), '_blank');
    else if (canal === 'x') window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(texte) + '&url=' + encodeURIComponent(url), '_blank');
    else if (canal === 'copier') {
      if (navigator.share) { try { await navigator.share({ title: ent.nom + ' — Randevou.ht', text: texte, url }); return; } catch {} }
      try { await navigator.clipboard.writeText(url); toast('Lien copié ! Collez-le où vous voulez.'); }
      catch { prompt('Copiez ce lien :', url); }
    }
  };

  document.getElementById('listeServices').innerHTML = ent.description
    ? `<p class="muet petit" style="margin-bottom:12px">${ech(ent.description)}</p>` : '';

  // ---- Module Chambres & Séjours ----
  if (ent.chambres && ent.chambres.length) {
    document.getElementById('carteChambres').style.display = '';
    document.getElementById('listeChambres').innerHTML = ent.chambres.map(c => `
      <div class="flex" style="gap:12px;padding:10px 0;border-bottom:1px solid var(--bordure);align-items:flex-start">
        ${c.photo ? `<img src="${c.photo}" alt="${ech(c.nom)}" style="width:86px;height:64px;object-fit:cover;border-radius:10px;flex-shrink:0">` : `<div style="width:86px;height:64px;border-radius:10px;background:linear-gradient(135deg,var(--marque),var(--marque2));display:grid;place-items:center;font-size:26px;flex-shrink:0">🛏️</div>`}
        <div style="flex:1">
          <div class="flex entre"><strong>${ech(c.nom)}</strong><strong style="color:var(--marque)">${(+c.prixNuit).toLocaleString('fr-HT')} HTG<span class="muet petit">/nuit</span></strong></div>
          <p class="petit muet">${ech(c.description || '')}</p>
          <p class="petit muet">👥 ${c.capacite} pers. max • ${c.quantite} chambre${c.quantite > 1 ? 's' : ''} de ce type</p>
        </div>
      </div>`).join('');
    const sel = document.getElementById('sjChambre');
    sel.innerHTML = ent.chambres.map(c => `<option value="${c.id}">${ech(c.nom)} — ${(+c.prixNuit).toLocaleString('fr-HT')} HTG/nuit</option>`).join('');
    const auj = new Date(), dem = new Date(Date.now() + 86400000);
    document.getElementById('sjArrivee').min = auj.toISOString().slice(0,10);
    document.getElementById('sjDepart').min = dem.toISOString().slice(0,10);
    ['sjArrivee','sjDepart','sjChambre'].forEach(id => document.getElementById(id).addEventListener('change', verifierSejour));
  }

  window.verifierSejour = async () => {
    const a = document.getElementById('sjArrivee').value, d = document.getElementById('sjDepart').value;
    const zone = document.getElementById('sjDispo'), coord = document.getElementById('sjCoordonnees');
    coord.style.display = 'none';
    if (!a || !d) { zone.innerHTML = ''; return; }
    zone.innerHTML = '<p class="petit muet">Vérification…</p>';
    try {
      const r = await api(`/api/disponibilites-sejour?slug=${slug}&chambre=${document.getElementById('sjChambre').value}&arrivee=${a}&depart=${d}`);
      if (r.disponible) {
        zone.innerHTML = `<div style="background:#D1FADF;border-radius:10px;padding:12px 14px" class="petit">✅ <strong>Disponible</strong> — ${r.nuits} nuit${r.nuits>1?'s':''} × ${(+r.prixNuit).toLocaleString('fr-HT')} HTG = <strong>${(+r.prixTotal).toLocaleString('fr-HT')} HTG</strong> <span class="muet">(paiement sur place)</span></div>`;
        coord.style.display = '';
      } else {
        zone.innerHTML = `<div style="background:#FEE4E2;border-radius:10px;padding:12px 14px" class="petit">❌ Complet sur ces dates. Essayez d'autres dates ou un autre type de chambre.</div>`;
      }
    } catch (err) { zone.innerHTML = `<div style="background:#FEE4E2;border-radius:10px;padding:12px 14px" class="petit">${ech(err.message)}</div>`; }
  };

  window.reserverSejour = async () => {
    const nom = document.getElementById('sjNom').value.trim();
    const tel = document.getElementById('sjTel').value.trim();
    if (!nom || !tel) { toast('Nom et téléphone obligatoires.'); return; }
    try {
      const r = await api('/api/sejours', 'POST', {
        slug, chambreId: document.getElementById('sjChambre').value,
        arrivee: document.getElementById('sjArrivee').value, depart: document.getElementById('sjDepart').value,
        nbPersonnes: +document.getElementById('sjPersonnes').value || 1,
        clientNom: nom, clientTel: tel, clientEmail: document.getElementById('sjEmail').value.trim()
      });
      document.getElementById('sjCoordonnees').style.display = 'none';
      document.getElementById('sjPaiement').style.display = '';
      document.getElementById('montantPaiement').textContent = `Montant à payer : ${(+r.prixTotal).toLocaleString('fr-HT')} HTG`;
      window.sjourId = r.reference;  // Stocker la référence pour le paiement
      toast('Demande de séjour envoyée ! Procédez au paiement pour confirmer.');
    } catch (err) { toast(err.message); }
  };

  window.initierPaiement = async (type) => {
    const montant = document.getElementById('sjDispo').innerText.match(/([0-9,]+) HTG/)?.[1]?.replace(/,/g, '') || 0;
    if (!montant || montant < 20) { toast('Montant invalide.'); return; }
    try {
      const result = await api('/api/paiements/ouvrir', 'POST', {
        commandeType: 'sejour', commandeId: window.sjourId || '', slug
      });
      if (result.ok && result.urlPaiement) {
        // Rediriger vers la passerelle
        toast('Redirection vers le paiement...');
        setTimeout(() => { window.location.href = result.urlPaiement; }, 500);
      } else toast(result.erreur || 'Erreur paiement');
    } catch (err) { toast(err.message); }
  };
  document.getElementById('listeServices').innerHTML += ent.services.map(s => `
    <div class="ligne-service">
      <div><strong>${ech(s.nom)}</strong><div class="petit muet">⏱ ${s.duree} min</div></div>
      <div class="flex"><strong>${htg(s.prix)}</strong>
      <button class="btn btn-contour btn-petit" onclick="choisirService('${s.id}')">Choisir</button></div>
    </div>`).join('') || '<p class="muet">Aucun service publié pour le moment.</p>';

  document.getElementById('listeAvis').innerHTML = ent.avis.length ? ent.avis.map(a => `
    <div style="padding:12px 0;border-bottom:1px solid var(--bordure)">
      <div class="flex entre"><strong class="petit">${ech(a.clientNom)}</strong><span class="etoiles petit">${etoiles(a.note)}</span></div>
      <p class="petit muet" style="margin-top:4px">${ech(a.commentaire)}</p>
    </div>`).join('') : '<p class="muet petit">Aucun avis pour le moment. Soyez le premier à partager votre expérience !</p>';

  document.getElementById('infos').innerHTML = `
    <p>📍 ${ech(ent.adresse) || '—'}</p>
    <p style="margin-top:6px">📞 ${ech(ent.telephone) || '—'}</p>
    ${(ent.latitude != null && ent.longitude != null) ? `<a class="btn btn-contour btn-petit mt" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${ent.latitude},${ent.longitude}">🧭 Itinéraire</a>` : ''}`;
  document.getElementById('horaires').innerHTML = ['lun','mar','mer','jeu','ven','sam','dim'].map(j => {
    const h = ent.horaires[j];
    return `<div><span>${NOMS_JOURS[j]}</span><span class="${h.ouvert ? '' : 'muet'}">${h.ouvert ? h.debut + ' – ' + h.fin : 'Fermé'}</span></div>`;
  }).join('');
  document.getElementById('equipe').innerHTML = ent.employes.map(x => `
    <div class="flex" style="padding:6px 0"><span class="avatar">${ech(x.nom.split(' ').map(w=>w[0]).join('').slice(0,2))}</span>
    <div><strong class="petit">${ech(x.nom)}</strong><div class="petit muet">${ech(x.poste)}</div></div></div>`).join('') || '<p class="muet petit">—</p>';

  dessinerPas();
  initCarte();
}

// ===== Carte de localisation et distance =====
let carteLeaflet = null, marqueurClient = null, ligneDistance = null;

function distanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function initCarte(essai = 0) {
  if (ent.latitude == null || ent.longitude == null) return;  // pas de position enregistrée
  const section = document.getElementById('carteLocalisation');
  section.style.display = '';
  if (typeof L === 'undefined') {
    // Leaflet est chargé en différé : on réessaie brièvement avant d'abandonner
    if (essai < 20) return setTimeout(() => initCarte(essai + 1), 250);
    document.getElementById('mapDistance').innerHTML =
      '<p class="petit muet" style="padding:16px">Carte indisponible (connexion requise).</p>';
    document.getElementById('btnMaPosition').style.display = 'none';
    return;
  }
  if (carteLeaflet) return;  // déjà initialisée
  carteLeaflet = L.map('mapDistance').setView([ent.latitude, ent.longitude], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(carteLeaflet);
  L.marker([ent.latitude, ent.longitude]).addTo(carteLeaflet)
    .bindPopup(`<strong>${ech(ent.nom)}</strong><br>${ech(ent.adresse || '')}`).openPopup();
  document.getElementById('infoDistance').textContent = 'Position de l\'établissement.';
}

function afficherMaPosition() {
  if (!carteLeaflet) return;
  const btn = document.getElementById('btnMaPosition');
  const info = document.getElementById('infoDistance');
  if (!navigator.geolocation) { info.textContent = 'Votre navigateur ne permet pas la géolocalisation.'; return; }
  btn.disabled = true; info.textContent = 'Recherche de votre position…';
  navigator.geolocation.getCurrentPosition(pos => {
    btn.disabled = false;
    const cLat = pos.coords.latitude, cLng = pos.coords.longitude;
    const eLat = ent.latitude, eLng = ent.longitude;
    if (marqueurClient) carteLeaflet.removeLayer(marqueurClient);
    if (ligneDistance) carteLeaflet.removeLayer(ligneDistance);
    marqueurClient = L.circleMarker([cLat, cLng], { radius: 8, color: '#16A34A', fillColor: '#16A34A', fillOpacity: .9 })
      .addTo(carteLeaflet).bindPopup('Vous êtes ici');
    ligneDistance = L.polyline([[cLat, cLng], [eLat, eLng]], { color: ent.couleur || '#2563EB', weight: 3, dashArray: '8 6' })
      .addTo(carteLeaflet);
    carteLeaflet.fitBounds(ligneDistance.getBounds(), { padding: [30, 30] });
    const d = distanceKm(cLat, cLng, eLat, eLng);
    info.innerHTML = `Distance à vol d'oiseau : <strong>${d < 1 ? Math.round(d * 1000) + ' m' : d.toFixed(1) + ' km'}</strong>`;
  }, err => {
    btn.disabled = false;
    info.textContent = err.code === 1
      ? 'Autorisation refusée. Activez la localisation pour voir la distance.'
      : 'Position introuvable. Réessayez.';
  }, { enableHighAccuracy: true, timeout: 12000 });
}

function choisirService(id) {
  resa.service = ent.services.find(s => s.id === id);
  resa.pas = 2; resa.date = ''; resa.heure = '';
  dessinerPas();
  document.getElementById('carteResa').scrollIntoView({ behavior: 'smooth' });
}

function dessinerPas() {
  document.querySelectorAll('#barrePas .pas').forEach((el, i) => el.classList.toggle('fait', i < resa.pas));
  const z = document.getElementById('zonePas');
  const min = new Date().toISOString().slice(0, 10);

  if (resa.pas === 1) {
    z.innerHTML = `<p class="petit muet">Étape 1 sur 4 — Choisissez un service</p>
      <div style="display:grid;gap:8px;margin-top:12px">
      ${ent.services.map(s => `<button class="creneau" style="text-align:left;padding:11px 14px" onclick="choisirService('${s.id}')">${ech(s.nom)} <span class="muet" style="font-weight:400">• ${s.duree} min • ${htg(s.prix)}</span></button>`).join('')}
      </div>`;
  }
  if (resa.pas === 2) {
    z.innerHTML = `<p class="petit muet">Étape 2 sur 4 — <strong>${ech(resa.service.nom)}</strong> : choisissez une date</p>
      <label>Date du rendez-vous</label>
      <input type="date" id="champDate" min="${min}" value="${resa.date || min}">
      <div class="flex mt" style="justify-content:space-between">
        <button class="btn btn-fantome btn-petit" onclick="resa.pas=1;dessinerPas()">← Retour</button>
        <button class="btn btn-primaire" style="background:var(--marque)" onclick="validerDate()">Voir les créneaux</button>
      </div>`;
  }
  if (resa.pas === 3) chargerCreneaux();
  if (resa.pas === 4) {
    z.innerHTML = `<p class="petit muet">Étape 4 sur 4 — Vos coordonnées</p>
      <div class="recap mt">
        <div><span>Service</span><strong>${ech(resa.service.nom)}</strong></div>
        <div><span>Date</span><strong>${dateFR(resa.date)}</strong></div>
        <div><span>Heure</span><strong>${resa.heure}</strong></div>
        <div><span>Prix</span><strong>${htg(resa.service.prix)}</strong></div>
      </div>
      <label>Nom complet *</label><input id="cNom" placeholder="Ex : Jean Michel">
      <label>Téléphone (WhatsApp) *</label><input id="cTel" placeholder="Ex : +509 3712 0000">
      <label>Email (recommandé)</label><input id="cEmail" type="email" placeholder="exemple@gmail.com — pour recevoir votre confirmation">
      <div class="champ-erreur" id="erreurResa"></div>
      <div class="flex" style="justify-content:space-between">
        <button class="btn btn-fantome btn-petit" onclick="resa.pas=3;dessinerPas()">← Retour</button>
        <button class="btn btn-primaire" style="background:var(--marque)" onclick="confirmerResa()">Confirmer le rendez-vous</button>
      </div>`;
  }
}

function validerDate() {
  resa.date = document.getElementById('champDate').value;
  if (!resa.date) return toast('Choisissez une date.');
  resa.pas = 3; dessinerPas();
}

async function chargerCreneaux() {
  const z = document.getElementById('zonePas');
  z.innerHTML = '<p class="petit muet">Chargement des disponibilités…</p>';
  let creneaux;
  try {
    ({ creneaux } = await api(`/api/disponibilites?slug=${slug}&service=${resa.service.id}&date=${resa.date}`));
  } catch (e) {
    z.innerHTML = `<p class="petit" style="color:var(--rouge,#DC2626)">Impossible de charger les disponibilités : ${ech(e.message || 'erreur réseau')}</p>
      <div class="flex mt" style="gap:8px">
        <button class="btn btn-fantome btn-petit" onclick="resa.pas=2;dessinerPas()">← Changer la date</button>
        <button class="btn btn-contour btn-petit" onclick="chargerCreneaux()">Réessayer</button>
      </div>`;
    return;
  }
  z.innerHTML = `<p class="petit muet">Étape 3 sur 4 — Créneaux du <strong>${dateFR(resa.date)}</strong></p>
    ${creneaux.length ? `<div class="creneaux">${creneaux.map(h => `<button class="creneau" onclick="choisirHeure('${h}', this)">${h}</button>`).join('')}</div>`
      : '<p class="muet petit mt">Aucun créneau disponible ce jour-là. Choisissez une autre date.</p>'}
    <div class="flex mt" style="justify-content:space-between">
      <button class="btn btn-fantome btn-petit" onclick="resa.pas=2;dessinerPas()">← Changer la date</button>
      <button class="btn btn-primaire" style="background:var(--marque)" id="btnSuite" disabled onclick="resa.pas=4;dessinerPas()">Continuer</button>
    </div>`;
}

function choisirHeure(h, el) {
  resa.heure = h;
  document.querySelectorAll('.creneau').forEach(c => c.classList.remove('choisi'));
  el.classList.add('choisi');
  document.getElementById('btnSuite').disabled = false;
}

async function confirmerResa() {
  const nom = document.getElementById('cNom').value.trim();
  const tel = document.getElementById('cTel').value.trim();
  const email = document.getElementById('cEmail').value.trim();
  const err = document.getElementById('erreurResa');
  if (!nom || !tel) { err.textContent = 'Le nom et le téléphone sont obligatoires.'; return; }
  try {
    const r = await api('/api/reservations', 'POST', { slug, serviceId: resa.service.id, date: resa.date, heure: resa.heure, clientNom: nom, clientTel: tel, clientEmail: email });
    document.getElementById('zonePas').innerHTML = `
      <div class="centre" style="padding:14px 0">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--vert);color:#fff;display:grid;place-items:center;font-size:26px;margin:0 auto 14px">✓</div>
        <h3>Rendez-vous enregistré !</h3>
        <p class="petit muet" style="margin-top:8px">Votre rendez-vous chez <strong>${ech(r.entreprise)}</strong> pour <strong>${ech(r.service)}</strong> le <strong>${dateFR(r.date)}</strong> à <strong>${r.heure}</strong> a été enregistré.</p>
        <p class="petit muet" style="margin-top:8px">Référence : <strong>${r.reference}</strong></p>
        <div style="background:#D1FADF;border-radius:10px;padding:14px;margin-top:16px">
          <strong>✅ Paiement requis</strong>
          <p class="petit muet" style="margin-top:6px">Procédez au paiement pour valider définitivement votre réservation.</p>
          <p style="font-weight:600;font-size:18px;margin-top:8px;color:#16A34A">Montant : ${htg(resa.service.prix)}</p>
          <button class="btn btn-primaire" style="width:100%;margin-top:12px;background:var(--marque)" onclick="initierPaiementRdv('${r.reference}')">💳 Payer maintenant</button>
        </div>
        ${r.whatsapp ? `<a class="btn btn-succes mt" style="margin-top:14px" target="_blank" rel="noopener" href="https://wa.me/${r.whatsapp}?text=${encodeURIComponent("Bonjour, j'ai réservé « " + r.service + " » le " + r.date + " à " + r.heure + " (réf. " + r.reference + ").")}">Contacter sur WhatsApp</a>` : ''}
      </div>`;
    document.querySelectorAll('#barrePas .pas').forEach(el => el.classList.add('fait'));
    window.rdvReference = r.reference;  // Stocker pour le paiement
  } catch (e) { err.textContent = e.message; }
}

async function initierPaiementRdv(reference) {
  try {
    const result = await api('/api/paiements/ouvrir', 'POST', {
      commandeType: 'rdv', commandeId: reference, slug
    });
    if (result.ok && result.urlPaiement) {
      toast('Redirection vers le paiement...');
      setTimeout(() => { window.location.href = result.urlPaiement; }, 500);
    } else toast(result.erreur || 'Erreur paiement');
  } catch (err) { toast(err.message); }
}

async function envoyerAvis() {
  const nom = document.getElementById('avisNom').value.trim();
  if (!nom) return toast('Indiquez votre nom.');
  await api('/api/avis', 'POST', { slug, clientNom: nom, note: document.getElementById('avisNote').value, commentaire: document.getElementById('avisTexte').value });
  document.getElementById('voileAvis').classList.remove('ouvert');
  toast('Merci pour votre avis !');
  charger();
}

charger();
</script>
</body>
</html>
